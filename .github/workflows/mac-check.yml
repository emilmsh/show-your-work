# Runs the Mac's look-up (scripts/show.js) on one of GitHub's Macs. A REPORT,
# not a gate: it is started by hand, or by pushing to a branch named
# mac-check/..., and never by an ordinary push. Read the log and the files it
# keeps (CLAUDE.md § Commands).
#
#   files    no Office on the machine: everything the script reads itself,
#            by the Mac's own means (osascript, unzip, NSString)
#   office   Word, Excel and PowerPoint installed unlicensed: their scripting
#            dictionaries are printed (the names the script calls must be in
#            them), and the look-up is tried against the programs. Best
#            effort: an unlicensed Office may sit behind a sign-in window.
name: mac-check

on:
  workflow_dispatch:
  push:
    branches: ['mac-check/**']

permissions:
  contents: read

jobs:
  files:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The script is plain ASCII
        run: "! LC_ALL=C grep -n '[^[:print:][:space:]]' scripts/show.js scripts/test/check-mac.js"
      - name: The hard cases, by osascript
        run: |
          python -m pip install --quiet openpyxl python-pptx
          python scripts/test/make_hard.py "$RUNNER_TEMP/hard"
          SYW_OSASCRIPT=1 node scripts/test/check-cases.mjs "$RUNNER_TEMP/hard" || true
      - name: The demo set, looked up and shown (no Office here)
        run: sh scripts/test/check-mac.sh show || true

  office:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Word, Excel and PowerPoint
        run: brew install --cask microsoft-word microsoft-excel microsoft-powerpoint
      - name: Their scripting dictionaries
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for app in Word Excel PowerPoint; do
            sdef "/Applications/Microsoft $app.app" > "$RUNNER_TEMP/out/$app.sdef" || true
            wc -c "$RUNNER_TEMP/out/$app.sdef"
          done
      - name: Let the shell control them, and skip the first-run screens
        run: |
          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          agent="$(ps -axo comm | grep -m1 hosted-compute-agent || true)"
          echo "agent: $agent"
          for client in "$agent" /bin/bash /bin/sh /usr/bin/osascript; do
            for target in com.microsoft.Word com.microsoft.Excel com.microsoft.Powerpoint com.apple.systemevents; do
              sudo sqlite3 "$db" ".timeout 10000" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAppleEvents','$client',1,2,3,1,NULL,NULL,0,'$target',NULL,0,strftime('%s','now'),NULL,NULL,'UNUSED',0);" || true
            done
          done
          sudo sqlite3 "$db" ".timeout 10000" "SELECT service, client, auth_value, indirect_object_identifier FROM access WHERE service='kTCCServiceAppleEvents';" || true
          for id in com.microsoft.Word com.microsoft.Excel com.microsoft.Powerpoint; do
            defaults write "$id" kSubUIAppCompletedFirstRunSetup1507 -bool true
            defaults write "$id" SendAllTelemetryEnabled -bool false
          done
          # ... and let it press a button in another program's window
          for client in "$agent" /bin/bash /bin/sh /usr/bin/osascript; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" ".timeout 10000" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,strftime('%s','now'),NULL,NULL,'UNUSED',0);" || true
          done
      - name: The demo set against the programs
        run: |
          # Whoever asks «may this control Word?» is answered, and the screen
          # is kept every half minute: what stood in the way is read off it
          (n=0; while true; do
             osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to click button "Allow" of window 1' >/dev/null 2>&1 || true
             # An unlicensed Office opens on an offer to buy it, in a window
             # named after the program: closed, never answered
             for app in Word Excel PowerPoint; do
               osascript -e "tell application \"System Events\" to tell process \"Microsoft $app\" to click (first button whose subrole is \"AXCloseButton\") of (first window whose name is \"$app\")" >/dev/null 2>&1 || true
             done
             n=$((n+1)); [ $((n % 6)) -eq 0 ] && screencapture -x "$RUNNER_TEMP/out/screen-$n.png"
             sleep 5
           done) &
          perl -e 'alarm shift; exec @ARGV' 500 sh scripts/test/check-mac.sh > "$RUNNER_TEMP/out/result.txt" 2>&1 || true
          cat "$RUNNER_TEMP/out/result.txt"
          screencapture -x "$RUNNER_TEMP/out/after-lookup.png" || true
          perl -e 'alarm shift; exec @ARGV' 800 sh scripts/test/check-mac.sh show > "$RUNNER_TEMP/out/shown.txt" 2>&1 || true
          cat "$RUNNER_TEMP/out/shown.txt"
          screencapture -x "$RUNNER_TEMP/out/after-show.png" || true
          kill %1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check
          path: ${{ runner.temp }}/out

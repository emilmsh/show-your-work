# Runs the Mac's look-up (scripts/show.js) on one of GitHub's Macs. A REPORT,
# not a gate: it is started by hand, or by pushing to a branch named
# mac-check/..., and never by an ordinary push. Read the log and the files it
# keeps (CLAUDE.md § Commands).
#
#   files    no Office on the machine: everything the script reads itself,
#            by the Mac's own means (osascript, unzip, NSString)
#   office   Word, Excel and PowerPoint installed unlicensed: their scripting
#            dictionaries are printed (the names the script calls must be in
#            them), and the look-up is tried against the programs. Best
#            effort: an unlicensed Office may sit behind a sign-in window.
name: mac-check

on:
  workflow_dispatch:
  push:
    branches: ['mac-check/**']

permissions:
  contents: read

jobs:
  files:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The script is plain ASCII
        run: "! LC_ALL=C grep -n '[^[:print:][:space:]]' scripts/show.js scripts/test/check-mac.js"
      - name: The hard cases, by osascript
        run: |
          python -m pip install --quiet openpyxl python-pptx
          python scripts/test/make_hard.py "$RUNNER_TEMP/hard"
          SYW_OSASCRIPT=1 node scripts/test/check-cases.mjs "$RUNNER_TEMP/hard" || true
      - name: The demo set, looked up and shown (no Office here)
        run: sh scripts/test/check-mac.sh show || true

  office:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Word, Excel and PowerPoint
        run: brew install --cask microsoft-word microsoft-excel microsoft-powerpoint
      - name: Their scripting dictionaries
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for app in Word Excel PowerPoint; do
            sdef "/Applications/Microsoft $app.app" > "$RUNNER_TEMP/out/$app.sdef" || true
            wc -c "$RUNNER_TEMP/out/$app.sdef"
          done
          cd "$RUNNER_TEMP/out"
          echo '--- Word'
          grep -n -i -E 'name="(get range information|create range|select|text object|content|start of content|end of content|posix full name|full name|close)"' Word.sdef | head -60 || true
          grep -n -i 'active end page number' Word.sdef | head || true
          echo '--- Excel'
          grep -n -i -E 'name="(string value|formula|value|get address|merge cells|merge area|used range|activate object|select|posix full name|full name|close)"' Excel.sdef | head -60 || true
          echo '--- PowerPoint'
          grep -n -i -E 'name="(go to slide|document window|view|posix full name|full name|slide|select)"' PowerPoint.sdef | head -60 || true
      - name: Let the shell control them, and skip the first-run screens
        run: |
          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          sqlite3 "$db" '.schema access' || true
          for client in /bin/bash /bin/sh /usr/bin/osascript /usr/local/opt/runner/provisioner/provisioner; do
            for target in com.microsoft.Word com.microsoft.Excel com.microsoft.Powerpoint; do
              sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceAppleEvents','$client',1,2,3,1,NULL,NULL,0,'$target',NULL,0,strftime('%s','now'),NULL,NULL,'UNUSED',0);" || true
            done
          done
          for id in com.microsoft.Word com.microsoft.Excel com.microsoft.Powerpoint; do
            defaults write "$id" kSubUIAppCompletedFirstRunSetup1507 -bool true
            defaults write "$id" SendAllTelemetryEnabled -bool false
          done
          defaults write com.microsoft.office OfficeAutoSignIn -bool false || true
      - name: The demo set against the programs
        run: |
          perl -e 'alarm shift; exec @ARGV' 900 sh scripts/test/check-mac.sh > "$RUNNER_TEMP/out/result.txt" 2>&1 || true
          cat "$RUNNER_TEMP/out/result.txt"
          screencapture -x "$RUNNER_TEMP/out/after-lookup.png" || true
      - name: One of each shown
        run: |
          perl -e 'alarm shift; exec @ARGV' 600 sh scripts/test/check-mac.sh show > "$RUNNER_TEMP/out/shown.txt" 2>&1 || true
          cat "$RUNNER_TEMP/out/shown.txt"
          screencapture -x "$RUNNER_TEMP/out/after-show.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check
          path: ${{ runner.temp }}/out

# Runs what can be run of the Mac's look-up (scripts/show.js) on one of
# GitHub's Macs. Started by hand, or by pushing to a branch named
# mac-check/..., and never by an ordinary push (CLAUDE.md § Platforms).
#
#   files          no Office on the machine: everything the script reads
#                  itself, by the Mac's own means (osascript, unzip, NSString),
#                  and text, HTML and the web shown
#   dictionaries   Word, Excel and PowerPoint installed, never started: every
#                  name the script calls must be in their scripting
#                  dictionaries
#
# What it cannot do is ask the programs anything: an unlicensed Office opens
# on an offer to buy it, with no document behind it (tried 2026-11-27). That
# part is docs/MAC-TEST.md, by a person.
name: mac-check

on:
  workflow_dispatch:
  push:
    branches: ['mac-check/**']

permissions:
  contents: read

jobs:
  files:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The script is plain ASCII
        run: "! LC_ALL=C grep -n '[^[:print:][:space:]]' scripts/show.js scripts/test/check-mac.js"
      - name: The hard cases, by osascript
        run: |
          python -m pip install --quiet openpyxl python-pptx
          python scripts/test/make_hard.py "$RUNNER_TEMP/hard"
          SYW_OSASCRIPT=1 node scripts/test/check-cases.mjs "$RUNNER_TEMP/hard"
      - name: The demo set, looked up and shown (the Office cases fail here)
        run: sh scripts/test/check-mac.sh show || true

  dictionaries:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Install Word, Excel and PowerPoint
        run: brew install --cask microsoft-word microsoft-excel microsoft-powerpoint
      - name: Every name the script calls is in them
        run: |
          missing=0
          has() {
            app="$1"; shift
            sdef "/Applications/Microsoft $app.app" > "$RUNNER_TEMP/$app.sdef"
            for name in "$@"; do
              if grep -q "name=\"$name\"" "$RUNNER_TEMP/$app.sdef"; then
                echo "ok       $app: $name"
              else
                echo "MISSING  $app: $name"
                missing=$((missing + 1))
              fi
            done
          }
          has Word 'create range' 'get range information' 'information type' 'active end page number' \
            'text object' 'content' 'start of content' 'end of content' 'posix full name' 'full name'
          has Excel 'string value' 'formula' 'value' 'get address' 'merge cells' 'merge area' \
            'used range' 'activate object' 'full name'
          has PowerPoint 'go to slide' 'number' 'document window' 'view' 'full name'
          exit "$missing"
